# Build every firmware project under FW/ on Ubuntu and publish snapshot
# archives to the "testing" GitHub release.  Modelled after the hplatformbox
# workflow from HCppBox, but extended to build all firmware projects
# sequentially.
#
# The full ghcr.io/zephyrproject-rtos/ci image is very large (the Zephyr SDK
# alone is ~13 GB with all toolchains), which exceeds the disk available on a
# standard GitHub-hosted runner once ESP-IDF and west modules are installed.
# Use a small Ubuntu base image and install only the ESP32 toolchain.
name: ubuntu firmware build

on:
  push:
    tags: [testing]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  IDF_TARGET: esp32
  IDF_GITHUB_ASSETS: dl.espressif.com/github_assets
  ZEPHYR_BOARD: esp32_devkitc/esp32/procpu
  ZEPHYR_VENV_BIN: /opt/python/venv
  ZSDK_VERSION: 1.0.1
  DEBIAN_FRONTEND: noninteractive

# The container's /bin/sh is dash, which does not support `set -o pipefail`.
# Force bash for every run step.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --user root
    permissions:
      contents: write

    steps:
      # actions/checkout needs git, but the ubuntu base image does not ship it.
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout repository and all submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure all submodules are initialized
        run: git submodule update --init --recursive --jobs 8

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake bc bison build-essential ca-certificates \
            ccache cmake curl dfu-util device-tree-compiler file flex g++ \
            gawk gcc gh git gperf kconfig-frontends libffi-dev \
            libncurses-dev libssl-dev libtool libusb-1.0-0 make \
            ninja-build patch pkg-config python3 python3-dev python3-pip \
            python3-setuptools python3-venv python3-wheel sed sudo unzip \
            wget xz-utils
          rm -rf /var/lib/apt/lists/*

      - name: Install minimal Zephyr SDK for ESP32
        run: |
          set -euo pipefail
          mkdir -p /opt/toolchains
          sdk_archive="/tmp/zephyr-sdk-${ZSDK_VERSION}_linux-x86_64_minimal.tar.xz"
          curl -fL --retry 3 -o "${sdk_archive}" \
            "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZSDK_VERSION}/zephyr-sdk-${ZSDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar -xf "${sdk_archive}" -C /opt/toolchains
          rm -f "${sdk_archive}"
          sdk_dir="/opt/toolchains/zephyr-sdk-${ZSDK_VERSION}"
          "${sdk_dir}/setup.sh" -t xtensa-espressif_esp32_zephyr-elf -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=${sdk_dir}" >> "$GITHUB_ENV"
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "$GITHUB_ENV"
          df -h /

      - name: Create Zephyr Python environment
        run: |
          python3 -m venv "${ZEPHYR_VENV_BIN}"
          "${ZEPHYR_VENV_BIN}/bin/python" -m pip install --upgrade pip
          "${ZEPHYR_VENV_BIN}/bin/pip" install west
          echo "${ZEPHYR_VENV_BIN}/bin" >> "$GITHUB_PATH"

      - name: Install ESP-IDF tools for ESP32
        run: |
          cd "$GITHUB_WORKSPACE/FW/3rdparty/esp-idf"
          ./install.sh esp32
          # The downloaded archives are no longer needed after installation.
          rm -rf "$HOME/.espressif/dist" "$HOME/.cache/pip"

      - name: Create sourceable ESP-IDF environment helper
        run: |
          cat > "$GITHUB_WORKSPACE/FW/esp-idf-env.sh" <<'ENVEOF'
          #!/usr/bin/env bash
          # CI helper: load the ESP-IDF build environment.
          # Unlike the developer helper, this file is safe to source from a
          # non-interactive shell (it does not exec an interactive shell).
          _env_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export IDF_PATH="${_env_dir}/3rdparty/esp-idf"
          export IDF_GITHUB_ASSETS="${IDF_GITHUB_ASSETS:-dl.espressif.com/github_assets}"
          export IDF_TARGET="${IDF_TARGET:-esp32}"
          # shellcheck disable=SC1091
          . "${IDF_PATH}/export.sh" >/dev/null
          unset _env_dir
          ENVEOF
          chmod +x "$GITHUB_WORKSPACE/FW/esp-idf-env.sh"

      - name: Prepare Zephyr workspace and ESP32 support
        run: |
          set -euo pipefail
          export PATH="${ZEPHYR_VENV_BIN}/bin:${PATH}"
          cd "$GITHUB_WORKSPACE/FW/005-zephyr"
          if [ ! -d .west ]; then
            if [ -d zephyr ]; then
              west init -l "$PWD/zephyr"
            else
              west init -m https://github.com/zephyrproject-rtos/zephyr \
                --mr v4.4-branch "$PWD"
            fi
          fi
          west update --narrow -o=--depth=1
          west packages pip --install
          "${ZEPHYR_VENV_BIN}/bin/pip" install \
            -r "$PWD/bootloader/mcuboot/scripts/requirements.txt" \
            "esptool>=5.0.2"
          west blobs fetch hal_espressif
          rm -rf "$HOME/.cache/pip"
          echo "ZEPHYR_BASE=$PWD/zephyr" >> "$GITHUB_ENV"
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-${ZSDK_VERSION}" >> "$GITHUB_ENV"
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "$GITHUB_ENV"
          df -h /

      - name: Build all firmware and publish snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/build-firmware.sh"
